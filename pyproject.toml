[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-transaction-stream"
version = "0.1.0"
description = "A reproducible synthetic transaction event producer"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
synthetic-transactions = "synthetic_transaction_stream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
